# Notificação com o resumo do dia.
# A Vercel (plano Hobby) só permite agendamento 1x por dia, por isso o
# disparo vem daqui. Horários em UTC — Brasília é UTC-3.
name: Resumo do dia

on:
  schedule:
    # Fechamento do dia, por volta das 23h de Brasília.
    #
    # Os :00 em ponto — e 00h UTC em especial — são os horários mais
    # disputados do agendador do GitHub, e é lá que ele mais atrasa.
    # Era o que fazia o fechamento das 21h chegar depois da meia-noite.
    # Os :50 saem da fila cheia; o resumo sabe se virar se atrasar mesmo
    # assim (ver diaDoResumo em api/lib-resumo.ts).
    - cron: '50 1 * * *'

    # ── PARCIAIS DESLIGADOS ────────────────────────────────────
    # Só fazem sentido quando o gasto diário do Meta chegar sozinho
    # (hoje o Ads é lançado à mão, então o ROAS do meio do dia sairia
    # sem base). Para religar, basta descomentar a linha abaixo:
    # parciais às 9h, 11h, 13h, 15h, 17h e 19h de Brasília.
    #
    # - cron: '0 12,14,16,18,20,22 * * *'
    # ───────────────────────────────────────────────────────────

  workflow_dispatch: # permite disparar na mão pelo GitHub
    inputs:
      tipo:
        description: 'Tipo do resumo'
        required: false
        default: final
        type: choice
        options: [final, parcial]

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar resumo
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          # Só o agendamento de 01h50 UTC está ativo hoje (fechamento).
          # Se os parciais forem religados, eles caem no else.
          if [ -n "${{ github.event.inputs.tipo }}" ]; then
            TIPO="${{ github.event.inputs.tipo }}"
          elif [ "${{ github.event.schedule }}" = "50 1 * * *" ]; then
            TIPO=final
          else
            TIPO=parcial
          fi
          echo "Enviando resumo: $TIPO"
          RESPOSTA=$(curl -s -m 30 -X POST \
            -H "Authorization: Bearer $CRON_TOKEN" \
            "https://alpha-company-tracking-eight.vercel.app/api/resumo-dia?tipo=$TIPO")
          echo "$RESPOSTA"
          echo "$RESPOSTA" | grep -q '"ok":true' || echo "::warning::resumo não enviado"
