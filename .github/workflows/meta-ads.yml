# Busca o gasto do Meta Ads dos últimos 3 dias e grava na dashboard,
# para quando ninguém está com ela aberta (aberta, ela mesma sincroniza a
# cada 10 minutos). Pedido a cada 30 minutos, fora dos :00 — mas o
# agendador do GitHub é "melhor esforço" e na prática roda de 3 em 3 h.
#
# O log NÃO mostra a resposta: ela traz o gasto do dia, e o log das
# Actions pode ser lido por outras pessoas. Só "ok" ou o aviso.
name: Gasto do Meta Ads

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar gasto no Meta
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          RESPOSTA=$(curl -s -m 60 -X POST \
            -H "Authorization: Bearer $CRON_TOKEN" \
            "https://alpha-company-tracking-eight.vercel.app/api/meta-ads?dias=3")
          if echo "$RESPOSTA" | grep -q '"ok":true'; then
            echo "ok"
          else
            echo "::warning::gasto do Meta não sincronizado"
            echo "$RESPOSTA" | grep -o '"aviso":"[^"]*"' || echo "sem resposta do servidor"
          fi
